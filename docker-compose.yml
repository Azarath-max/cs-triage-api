services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cs_automation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs_automation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      REPOSITORY: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cs_automation
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.70}
      AUTO_SEND_CONFIDENCE: ${AUTO_SEND_CONFIDENCE:-0.80}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
